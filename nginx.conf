# Keep add_header directives at one level so cache rules do not drop security headers.
# Missing assets and other error responses must never receive immutable caching.
map "$status:$uri" $weather_cache_control {
    default "no-cache";
    ~^(200|206|304):/_expo/static/ "public, max-age=31536000, immutable";
    ~^(200|206|304):/assets/ "public, max-age=86400";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header Cache-Control $weather_cache_control always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Metro uses content hashes in these asset names.
    location /_expo/static/ {
        try_files $uri =404;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # Revalidate the shell so deployments load the latest bundle.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
